<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="micGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Squircle Rounded App Icon Background -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="111" fill="none" stroke="#38bdf8" stroke-opacity="0.35" stroke-width="4"/>

  <!-- Background Decorative Sound Waves -->
  <g opacity="0.35" stroke="#38bdf8" stroke-width="8" stroke-linecap="round" fill="none">
    <path d="M 120 200 A 70 70 0 0 0 120 312" />
    <path d="M 90 170 A 110 110 0 0 0 90 342" />
    <path d="M 392 200 A 70 70 0 0 1 392 312" />
    <path d="M 422 170 A 110 110 0 0 1 422 342" />
  </g>

  <!-- Center Microphone Main Body -->
  <g filter="url(#shadow)">
    <!-- Capsule -->
    <rect x="206" y="120" width="100" height="180" rx="50" fill="url(#micGrad)"/>
    <!-- Capsule Mesh Highlight -->
    <rect x="220" y="135" width="72" height="70" rx="36" fill="#ffffff" fill-opacity="0.25"/>
    <!-- Microphone U-shape Cradle -->
    <path d="M 166 230 C 166 315 346 315 346 230" fill="none" stroke="#f8fafc" stroke-width="20" stroke-linecap="round"/>
    <!-- Stand Neck -->
    <path d="M 256 310 L 256 385" stroke="#f8fafc" stroke-width="20" stroke-linecap="round"/>
    <!-- Stand Base -->
    <path d="M 196 385 L 316 385" stroke="#f8fafc" stroke-width="22" stroke-linecap="round"/>
    <!-- Center AI Sparkle -->
    <circle cx="256" cy="205" r="8" fill="#ffffff"/>
  </g>

  <!-- AI Badge -->
  <g transform="translate(320, 95)">
    <rect width="76" height="34" rx="17" fill="#38bdf8" filter="url(#shadow)"/>
    <text x="38" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="18" fill="#0f172a" text-anchor="middle">AI</text>
  </g>
</svg>
